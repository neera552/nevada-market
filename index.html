<!DOCTYPE html>
<html lang="pt-MZ">
<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],display:['Space Grotesk','sans-serif']},colors:{neon:'#ccff00'}}}}</script>
<style>
:root{color-scheme:dark;--bg:#09090b;--fg:#f4f4f5}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:Inter,sans-serif;padding-bottom:84px;margin:0}
.inp{width:100%;background:#18181b;border:1px solid #3f3f46;border-radius:12px;padding:10px 14px;font-size:14px;color:#fff;outline:none}
.inp:focus{border-color:#ccff00}
.btn{display:block;width:100%;padding:12px;border-radius:12px;background:#ccff00;color:#000;font-weight:800;font-size:13px;text-align:center}

</head>
<body>
<div id="root"><p class="p-10 text-center text-zinc-400 text-sm">A carregar…</p></div>
<div id="modal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-black/80 sm:p-4" onclick="if(event.target===this)closeModal()"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 z-[70] bg-neon text-black text-xs font-bold px-4 py-2 rounded-full opacity-0 pointer-events-none transition-opacity"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendEmailVerification,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,setDoc,updateDoc,increment,addDoc,deleteDoc,onSnapshot,query,where,orderBy,limit,writeBatch}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyBhFiLjVGXoO52W9g3rmPNo_jgSBk3pD9Q",authDomain:"nevada-market-mz.firebaseapp.com",projectId:"nevada-market-mz",storageBucket:"nevada-market-mz.firebasestorage.app",messagingSenderId:"731505822215",appId:"1:731505822215:web:53cd52f11cd49f1e99f8a2"});
const auth=getAuth(app),db=getFirestore(app);

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MT=n=>Number(n).toLocaleString('pt-PT')+' MT';
const dt=t=>new Date(t).toLocaleDateString('pt-PT',{day:'2-digit',month:'short',year:'numeric'});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,3000)}

const CITIES=['Maputo','Matola','Beira','Nampula','Pemba','Chimoio','Tete','Quelimane','Xai-Xai','Inhambane','Lichinga'];
const CATS=['Tudo','Masculino','Feminino','Acessórios','Eletrónicos','Kits & Drops'];
const SUBS=['Telemóvel','Computador','Consola','Acessório eletrónico','Outro'];
const ACCT={hustle:'🔥 Hustle',loja:'🏪 Loja',empresa:'🏢 Empresa'},ACCTO=[['pessoal','👤 Pessoal'],['hustle','🔥 Hustle'],['loja','🏪 Loja'],['empresa','🏢 Empresa']];
const acctSel=v=>`<select name="ac" class="inp">${ACCTO.map(([k,l])=>`<option value="${k}" ${k===v?'selected':''}>${l}</option>`).join('')}</select>`;
let me=null,listings=[],salesO=[],buysO=[],unsubs=[],pendingProfile=null,banned={},reports=[],chatsB=[],chatsS=[],roomId=null,roomUnsub=null,roomMeta={},msgsL=[],dip=null,verified={},profiles={},reviews=[],guest=false,avPhoto=null,photos=[],editId=null,keepEdit=false,sortBy='rec',sizeF='Todos',galIdx=0;
const ADMIN='nevada4l.entertainment@gmail.com',isAdmin=()=>me&&me.key===ADMIN,myPhone=()=>me.phone||(me.type==='phone'?me.key:'');
let view='home',cat='Tudo',cityF='Todas',q='',sub='vendas',authMode='login',photo=null,selSize='';

/* ---------- Conta ---------- */
const PH=/^8[2-7]\d{7}$/;
function normPhone(v){let d=String(v).replace(/\D/g,'');if(d.startsWith('258')&&d.length===12)d=d.slice(3);return d}
function normId(v){v=v.trim().toLowerCase();if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))return{type:'email',key:v};const d=normPhone(v);return PH.test(d)?{type:'phone',key:d}:null}
const AE={'auth/email-already-in-use':'Esta conta já existe. Entre com a sua senha.','auth/invalid-credential':'Conta ou senha incorretos.','auth/wrong-password':'Conta ou senha incorretos.','auth/user-not-found':'Conta ou senha incorretos.','auth/weak-password':'A senha deve ter pelo menos 6 caracteres.','auth/network-request-failed':'Sem internet. Tente de novo.','auth/operation-not-allowed':'Ative E-mail/senha em Authentication no Firebase.','auth/too-many-requests':'Muitas tentativas. Aguarde um pouco.'};
async function submitAuth(e){
  e.preventDefault();const f=e.target,g=n=>f.elements[n]?f.elements[n].value:'',err=$('#authErr');err.textContent='';
  const id=normId(g('ident')),pw=g('pw');
  if(!id)return err.textContent='Use um e-mail válido ou um número moçambicano (ex: 84 123 4567).';
  if(pw.length<6)return err.textContent='A senha deve ter pelo menos 6 caracteres.';
  const mail=id.type==='phone'?id.key+'@phone.nevadamarket.mz':id.key;
  try{
    if(authMode==='reg'){
      if(!g('nm').trim())return err.textContent='Escreva o seu nome.';
      if(pw!==g('pw2'))return err.textContent='As senhas não coincidem.';
      pendingProfile={name:g('nm').trim(),type:id.type,key:id.key,acct:g('ac'),terms:Date.now()};
      const c=await createUserWithEmailAndPassword(auth,mail,pw);if(id.type==='email')sendEmailVerification(c.user).catch(()=>{});
    }else await signInWithEmailAndPassword(auth,mail,pw);
  }catch(x){pendingProfile=null;err.textContent=AE[x.code]||'Erro: '+x.code}
}
function setAuth(m){authMode=m;render()}
const logout=()=>signOut(auth);

const er=x=>toast('Erro de dados: '+x.code),by=s=>s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.date-a.date);
function listen(uid){
  const L=(c,f)=>onSnapshot(c,s=>{f(s);refresh()},er);
  unsubs=[L(query(collection(db,'listings'),orderBy('date','desc'),limit(200)),s=>{listings=s.docs.map(d=>({id:d.id,...d.data()}))}),
    L(collection(db,'verified'),s=>{verified={};s.docs.forEach(d=>verified[d.id]=1)}),
    L(collection(db,'profiles'),s=>{profiles={};s.docs.forEach(d=>profiles[d.id]=d.data())}),
    L(collection(db,'reviews'),s=>{reviews=s.docs.map(d=>({id:d.id,...d.data()}))}),
    L(collection(db,'banned'),s=>{banned={};s.docs.forEach(d=>banned[d.id]=1)})];
  if(uid)unsubs.push(L(query(collection(db,'orders'),where('sellerId','==',uid)),s=>{salesO=by(s)}),L(query(collection(db,'orders'),where('buyerId','==',uid)),s=>{buysO=by(s)}),L(query(collection(db,'chats'),where('buyerId','==',uid)),s=>{chatsB=by(s)}),L(query(collection(db,'chats'),where('sellerId','==',uid)),s=>{chatsS=by(s)}));
  if(uid&&isAdmin())unsubs.push(L(collection(db,'reports'),s=>{reports=by(s)}));
}
onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());unsubs=[];
  if(!u){me=null;salesO=[];buysO=[];if(guest)listen();render();return}
  guest=false;
  try{
    const ref=doc(db,'users',u.uid);let s=await getDoc(ref);
    if(s.exists())me={id:u.uid,...s.data()};
    else{const p={...(pendingProfile||{name:(u.email||'').split('@')[0],type:'email',key:u.email}),created:Date.now()};await setDoc(ref,p);await setDoc(doc(db,'profiles',u.uid),{name:p.name,acct:p.acct||'pessoal'});pendingProfile=null;me={id:u.uid,...p}}
  }catch(x){toast('Erro ao carregar a conta: '+x.code);return}
  try{if((await getDoc(doc(db,'banned',u.uid))).exists()){await signOut(auth);toast('Conta suspensa. Contacte nevada4l.entertainment@gmail.com');return}}catch(x){}
  listen(u.uid);view='home';render();
});
function goGuest(){guest=true;listen();view='home';render()}
function goAuth(){guest=false;unsubs.forEach(f=>f());unsubs=[];authMode='login';render()}

/* ---------- Layout ---------- */
const credits=()=>`<div class="mt-8 text-center text-[11px] text-zinc-500 leading-relaxed">
<p class="text-zinc-300 font-semibold">NEVADA STORE MZ é propriedade da NEVADA 4L Entertainment.</p>
<p>Criador: <b class="text-zinc-300">Cláudio Silvestre Fabião</b></p>
<p>Co-criador: Gemini · Upgrade: Claude</p>
<p><a class="text-neon" href="mailto:nevada4l.entertainment@gmail.com">nevada4l.entertainment@gmail.com</a></p>
<p class="mt-1">© 2026 NEVADA 4L. Todos os direitos reservados.</p><button onclick="showTerms()" class="text-neon underline mt-1">Termos de Uso</button></div>`;

function authHTML(){const r=authMode==='reg';
  const tab=(m,l)=>`<button onclick="setAuth('${m}')" class="flex-1 py-2 rounded-lg text-sm font-bold ${authMode===m?'bg-white text-black':'text-zinc-400'}">${l}</button>`;
  return `<div class="min-h-screen flex flex-col justify-center max-w-sm mx-auto px-5 py-8">
  <div class="text-center mb-6"><img src="logo.png" alt="NEVADA" class="w-28 h-28 mx-auto rounded-3xl mb-3">
  <h1 class="font-display text-2xl uppercase">Nevada Store</h1><p class="text-neon text-xs font-bold">🇲🇿 Moçambique</p></div>
  <div class="flex bg-zinc-900 rounded-xl p-1 mb-4">${tab('login','Entrar')}${tab('reg','Criar conta')}</div>
  <form onsubmit="submitAuth(event)" class="space-y-3">
  ${r?`<input name="nm" class="inp" placeholder="Nome completo (ou da loja/empresa)" autocomplete="name">${acctSel('pessoal')}`:''}
  <input name="ident" class="inp" placeholder="E-mail ou número de telemóvel" autocomplete="username" required>
  <input name="pw" type="password" class="inp" placeholder="Senha (mínimo 6 caracteres)" minlength="6" autocomplete="${r?'new-password':'current-password'}" required>
  ${r?'<input name="pw2" type="password" class="inp" placeholder="Confirmar senha" minlength="6" autocomplete="new-password" required>':''}
  ${r?'<label class="flex gap-2 text-xs text-zinc-400"><input type="checkbox" required> <span>Li e aceito os <button type="button" onclick="showTerms()" class="text-neon underline">Termos de Uso</button></span></label>':''}
  <p id="authErr" class="text-red-400 text-xs min-h-[1rem]"></p>
  <button class="btn">${r?'Criar conta':'Entrar'}</button>${r?'':'<button type="button" onclick="forgot()" class="text-xs text-zinc-400 underline w-full text-center">Esqueci a senha</button>'}</form><button onclick="goGuest()" class="btn2 w-full mt-3 !py-3">👀 Entrar como convidado</button>${credits()}</div>`}

function render(){
  if(!me&&guest){$('#root').innerHTML=`<header class="sticky top-0 z-40 bg-zinc-950 border-b border-zinc-800 px-4 py-3 flex items-center justify-between"><b class="font-display uppercase">Nevada Store</b><span class="text-xs text-zinc-400">👀 Convidado</span></header><main class="max-w-3xl mx-auto px-4 py-4">${homeHTML()}</main><nav class="fixed bottom-0 inset-x-0 z-40 bg-zinc-950/95 border-t border-zinc-800 p-3 pb-[calc(12px+env(safe-area-inset-bottom,0px))]"><button onclick="goAuth()" class="btn">Entrar ou criar conta para comprar e vender</button></nav>`;renderGrid();return}
  if(!me){$('#root').innerHTML=authHTML();return}
  const nav=[['home','🏠','Explorar'],['sell','＋','Vender'],['chat','💬','Chat'],['hist','🧾','Histórico'],['bank','💰','Banco'],['prof','👤','Perfil']];
  const body={home:homeHTML,sell:sellHTML,hist:histHTML,bank:bankHTML,prof:profHTML,chat:chatHTML,room:roomHTML}[view]();
  $('#root').innerHTML=`<header class="sticky top-0 z-40 bg-zinc-950 border-b border-zinc-800 px-4 py-3 flex items-center justify-between">
  <div class="flex items-center gap-2"><img src="logo.png" alt="NEVADA" class="w-8 h-8 rounded-lg">
  <div class="leading-tight"><b class="font-display uppercase">Nevada Store</b><span class="block text-[10px] text-zinc-400">NEVADA 4L · 🇲🇿</span></div></div>
  <span class="flex items-center gap-2 text-xs text-zinc-400">${av(me.photo,me.name,'w-7 h-7')}<b class="text-white">${esc(me.name.split(' ')[0])}</b></span></header>
  <main class="max-w-3xl mx-auto px-4 py-4">${body}</main>
  <nav class="fixed bottom-0 inset-x-0 z-40 bg-zinc-950/95 border-t border-zinc-800 flex justify-around pt-1.5 pb-[calc(6px+env(safe-area-inset-bottom,0px))]">
  ${nav.map(n=>`<button onclick="go('${n[0]}')" class="flex flex-col items-center px-3 py-1 text-[11px] font-semibold ${(view===n[0]||(view==='room'&&n[0]==='chat'))?'text-neon':'text-zinc-400'}"><span class="text-lg leading-none">${n[1]}</span>${n[2]}</button>`).join('')}</nav>`;
  if(view==='home')renderGrid();if(view==='sell')showPh();if(view==='room')drawMsgs();
}
function refresh(){if(!me&&!guest)return;if(view==='home')renderGrid();else if(view!=='sell'&&view!=='room')render()}
function go(v){if(!me){goAuth();return}if(roomUnsub){roomUnsub();roomUnsub=null}if(v==='sell'&&!keepEdit){editId=null;photos=[]}keepEdit=false;view=v;window.scrollTo(0,0);render()}

/* ---------- Explorar ---------- */
function homeHTML(){return `<div class="space-y-3">
<div class="flex gap-2"><input class="inp" placeholder="Procurar peças, kits, ténis..." value="${esc(q)}" oninput="setQ(this.value)">
<select class="inp !w-auto" onchange="setCity(this.value)"><option>Todas</option>${CITIES.map(c=>`<option ${c===cityF?'selected':''}>${c}</option>`).join('')}</select></div>
<div class="flex gap-2 overflow-x-auto no-sb">${CATS.map(c=>`<button onclick="setCat('${c}')" class="shrink-0 px-3.5 py-1.5 rounded-lg text-xs font-bold ${c===cat?'bg-white text-black':'bg-zinc-900 text-zinc-300'}">${c}</button>`).join('')}</div>
<div class="flex gap-2"><select class="inp" onchange="setSort(this.value)"><option value="rec">Mais recentes</option><option value="asc" ${sortBy==='asc'?'selected':''}>Preço: menor</option><option value="desc" ${sortBy==='desc'?'selected':''}>Preço: maior</option></select><select class="inp" onchange="setSz(this.value)">${['Todos','S','M','L','XL','XXL','Único','40','41','42','43','44'].map(x=>`<option value="${x}" ${x===sizeF?'selected':''}>${x==='Todos'?'Todos os tamanhos':x}</option>`).join('')}</select></div>
<p id="cnt" class="text-xs text-zinc-400"></p><div id="grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div></div>
<p class="mt-8 text-center text-[11px] text-zinc-600">NEVADA STORE MZ · propriedade da NEVADA 4L Entertainment</p>`}
const card=l=>`<button onclick="openItem('${l.id}')" class="text-left bg-zinc-900 rounded-2xl overflow-hidden border border-zinc-800">
<div class="aspect-[4/5] bg-zinc-800">${l.img?`<img src="${l.img}" alt="${esc(l.title)}" class="w-full h-full object-cover">`:'<div class="w-full h-full flex items-center justify-center text-4xl">👕</div>'}</div>
<div class="p-2.5"><p class="text-[11px] text-zinc-400">📍 ${esc(l.city)} · ${esc(l.cond)}${verified[l.owner]?' · <span class="text-neon">✓</span>':''}${rate(l.owner)?' · '+rate(l.owner):''}</p><h3 class="text-sm font-bold leading-tight">${esc(l.title)}</h3><p class="font-display text-neon mt-1">${MT(l.price)}</p><p class="text-[11px] ${l.status==='esgotado'?'text-red-400':'text-zinc-400'}">${l.status==='esgotado'?'Esgotado':'📦 '+(l.stock??1)+' em stock'}</p></div></button>`;
function renderGrid(){const g=$('#grid');if(!g)return;const t=q.trim().toLowerCase(),vis=l=>(l.status==='ativo'||l.status==='esgotado')&&!banned[l.owner],any=listings.some(vis);
  const r=listings.filter(l=>vis(l)&&(cat==='Tudo'||l.cat===cat)&&(cityF==='Todas'||l.city===cityF)&&(sizeF==='Todos'||l.sizes.some(z=>z.toUpperCase()===sizeF.toUpperCase()))&&(!t||(l.title+' '+(l.desc||'')+' '+(l.sub||'')).toLowerCase().includes(t)));
  if(sortBy!=='rec')r.sort((a,b)=>sortBy==='asc'?a.price-b.price:b.price-a.price);else r.sort((a,b)=>!!verified[b.owner]-!!verified[a.owner]);$('#cnt').textContent=r.length+(r.length===1?' anúncio':' anúncios');
  g.innerHTML=r.length?r.map(card).join(''):`<div class="col-span-full text-center py-14 bg-zinc-900 rounded-2xl border border-zinc-800"><p class="font-bold mb-1">${any?'Nenhuma peça encontrada':'Ainda não há anúncios'}</p><p class="text-xs text-zinc-400 mb-4">${any?'Mude a cidade, a categoria ou a pesquisa.':'Seja o primeiro a vender na NEVADA STORE.'}</p><button onclick="go('sell')" class="btn2 !bg-neon !text-black">Vender uma peça</button></div>`}

/* ---------- Anúncio / Compra ---------- */
const wa=(n,m)=>`https://wa.me/258${n}?text=${encodeURIComponent(m)}`;
function openItem(id,keep){const l=listings.find(x=>x.id===id);if(!l)return;
  if(!keep){galIdx=0;selSize=l.sizes.length===1?l.sizes[0]:''}
  const own=me&&l.owner===me.id,pr=profiles[l.owner]||{},vf=verified[l.owner];
  $('#modal').innerHTML=`<div class="bg-zinc-950 border border-zinc-800 w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[92vh] overflow-y-auto p-5 space-y-3">
  <div class="flex justify-between items-center"><span class="text-xs text-zinc-400">📍 ${esc(l.city)} · ${esc(l.cond)} · ${esc(l.cat)}</span><button onclick="closeModal()" class="btn2">Fechar</button></div>
  ${gal(l)}
  <h2 class="font-display text-xl leading-tight">${esc(l.title)}</h2><p class="font-display text-2xl text-neon">${MT(l.price)}</p><p class="text-xs text-zinc-300">📦 ${l.stock??1} em stock</p>
  ${l.desc?`<p class="text-sm text-zinc-300">${esc(l.desc)}</p>`:''}
  <div class="flex items-center gap-3 bg-zinc-900 rounded-xl p-3">${av(pr.photo,l.seller,'w-11 h-11')}<div class="text-xs text-zinc-400"><b class="text-white text-sm">${esc(pr.name||l.seller)}</b>${ACCT[pr.acct]?` <span class="text-zinc-300">${ACCT[pr.acct]}</span>`:''}${vf?' <span class="text-neon font-bold">✓ Verificado</span>':''}<br>${pr.city?'📍 '+esc(pr.city)+' · ':''}${rate(l.owner)||'Sem avaliações'}${vf&&pr.bio?'<br>'+esc(pr.bio):''}</div></div>
  <div><p class="text-xs font-bold text-zinc-400 mb-2">Tamanho</p><div class="flex flex-wrap gap-2">${l.sizes.map((s,i)=>`<button onclick="pickSize('${l.id}',${i})" class="px-3.5 py-1.5 rounded-xl text-xs font-bold border ${s===selSize?'bg-white text-black border-white':'border-zinc-700 text-zinc-300'}">${esc(s)}</button>`).join('')}</div></div>
  ${!me?`<button onclick="closeModal();goAuth()" class="btn">Crie uma conta para comprar</button>`:own?`<p class="text-xs text-zinc-400">Este anúncio é seu.</p>`:l.status!=='ativo'?`<p class="text-xs text-amber-300">Peça esgotada.</p>`:`<button onclick="buy('${l.id}')" class="btn !bg-[#25D366] !text-white">💬 Comprar no WhatsApp · ${MT(l.price)}</button>
  <p class="text-[11px] text-zinc-500 text-center">Vai falar direto com o vendedor. Pagamento e entrega combinam entre vocês.</p><button onclick="startChat('${l.id}')" class="btn2 w-full !py-3">💬 Chat (beta)</button>`}${me&&!own?`<button onclick="reportL('${l.id}')" class="text-xs text-zinc-500 underline">🚩 Denunciar anúncio</button>`:''}${isAdmin()?`<button onclick="adminDel('${l.id}')" class="btn2 w-full !bg-red-900">🛡️ Remover anúncio (admin)</button>`:''}</div>`;
  $('#modal').classList.add('flex');$('#modal').classList.remove('hidden')}
function pickSize(id,i){const l=listings.find(x=>x.id===id);selSize=l.sizes[i];openItem(id,true)}
function closeModal(){$('#modal').classList.add('hidden');$('#modal').classList.remove('flex')}
async function buy(id){const l=listings.find(x=>x.id===id);if(!l||l.status!=='ativo'||l.owner===me.id)return;
  if(!selSize)return toast('Escolha um tamanho.');
  const w=window.open('','_blank');
  try{
    const b=writeBatch(db);
    b.set(doc(collection(db,'orders')),{lid:l.id,title:l.title,price:l.price,size:selSize,city:l.city,sellerId:l.owner,seller:l.seller,sellerPhone:l.phone,buyerId:me.id,buyer:me.name,buyerContact:myPhone()||me.key,buyerType:myPhone()?'phone':me.type,status:'pendente',date:Date.now()});
    b.update(doc(db,'listings',l.id),{stock:(l.stock??1)-1,status:(l.stock??1)-1<=0?'esgotado':'ativo'});

  return `<div class="mt-4 bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-2"><b class="text-sm">🛡️ Admin</b><p class="text-xs text-zinc-400">Denúncias (${reports.length})</p>${reports.map(r=>`<div class="bg-zinc-950 rounded-xl p-2.5 text-xs"><b class="text-white">${esc(r.title)}</b> · ${esc(r.reason)}<div class="flex gap-2 mt-2 flex-wrap"><button onclick="adminDel('${r.lid}')" class="btn2">Apagar anúncio</button><button onclick="banUser('${r.owner}')" class="btn2">Banir vendedor</button><button onclick="ignoreRep('${r.id}')" class="btn2">Ignorar</button></div></div>`).join('')}
  <p class="text-xs text-zinc-400 pt-2">Vendedores</p>${vs.map(([id,n])=>`<div class="flex justify-between items-center"><span class="text-sm">${esc(n)}${verified[id]?' ✓':''}${banned[id]?' 🚫':''}</span><span class="flex gap-2"><button onclick="toggleVer('${id}')" class="btn2">${verified[id]?'Tirar ✓':'Verificar'}</button><button onclick="banUser('${id}')" class="btn2">${banned[id]?'Desbanir':'Banir'}</button></span></div>`).join('')||'<p class="text-xs text-zinc-500">Sem vendedores.</p>'}</div>`}
const chatName=c=>c.buyerId===me.id?c.sellerName:c.buyerName;
function chatHTML(){const cs=[...chatsB,...chatsS].sort((a,b)=>b.date-a.date);
  return `<h2 class="font-display text-xl mb-1">Chat <span class="text-[10px] bg-neon text-black rounded px-1.5 align-middle">BETA</span></h2><p class="text-xs text-zinc-400 mb-3">Abra uma peça e toque em “Chat (beta)” para falar com o vendedor.</p><div class="space-y-2">${cs.map(c=>`<button onclick="openRoom('${c.id}')" class="w-full text-left bg-zinc-900 border border-zinc-800 rounded-2xl p-3.5"><div class="flex justify-between"><b class="text-sm">${esc(chatName(c))}</b><span class="text-[11px] text-zinc-500">${dt(c.date)}</span></div><p class="text-xs text-zinc-400">${esc(c.title)}</p><p class="text-xs text-zinc-300 mt-1">${esc(c.last||'Sem mensagens')}</p></button>`).join('')||'<p class="text-center text-sm text-zinc-400 py-12">Ainda não tem conversas.</p>'}</div>`}
function roomHTML(){const c=[...chatsB,...chatsS].find(x=>x.id===roomId);
  return `<div class="flex items-center gap-2 mb-3"><button onclick="go('chat')" class="btn2">←</button><div><b class="text-sm">${esc(c?chatName(c):roomMeta.name||'Chat')}</b><p class="text-[11px] text-zinc-400">${esc(c?c.title:roomMeta.title||'')}</p></div></div><div id="msgs" class="space-y-2 pb-28 min-h-[50vh]"></div>
  <form onsubmit="sendMsg(event)" class="fixed inset-x-0 bottom-[calc(62px+env(safe-area-inset-bottom,0px))] z-40 bg-zinc-950 border-t border-zinc-800 p-2 flex gap-2 max-w-3xl mx-auto"><input name="tx" class="inp" maxlength="500" autocomplete="off" placeholder="Escreva uma mensagem..." required><button class="btn2 !bg-neon !text-black">Enviar</button></form>`}
function drawMsgs(){const b=$('#msgs');if(!b)return;b.innerHTML=msgsL.map(m=>`<div class="flex ${m.from===me.id?'justify-end':''}"><div class="max-w-[80%] px-3 py-2 rounded-2xl text-sm ${m.from===me.id?'bg-neon text-black':'bg-zinc-800'}">${esc(m.text)}</div></div>`).join('')||'<p class="text-center text-sm text-zinc-500 py-10">Diga olá 👋</p>';window.scrollTo(0,document.body.scrollHeight)}
function openRoom(id,meta){if(roomUnsub)roomUnsub();roomId=id;roomMeta=meta||{};msgsL=[];
  roomUnsub=onSnapshot(query(collection(db,'chats',id,'messages'),orderBy('date')),sn=>{msgsL=sn.docs.map(d=>d.data());drawMsgs()},er);view='room';render()}
async function startChat(lid){const l=listings.find(x=>x.id===lid);if(!l||!me||l.owner===me.id)return;const id=lid+'_'+me.id;
  try{const r=doc(db,'chats',id);if(!(await getDoc(r)).exists())await setDoc(r,{lid,title:l.title,sellerId:l.owner,sellerName:l.seller,buyerId:me.id,buyerName:me.name,last:'',lastFrom:'',date:Date.now()});closeModal();openRoom(id,{name:l.seller,title:l.title})}catch(x){toast('Erro no chat: '+x.code)}}
async function sendMsg(e){e.preventDefault();const f=e.target.elements,t=f.tx.value.trim();if(!t)return;f.tx.value='';
  try{await addDoc(collection(db,'chats',roomId,'messages'),{from:me.id,text:t,date:Date.now()});await updateDoc(doc(db,'chats',roomId),{last:t.slice(0,60),lastFrom:me.id,date:Date.now()})}catch(x){toast('Erro ao enviar: '+x.code)}}
async function toggleVer(id){try{verified[id]?await deleteDoc(doc(db,'verified',id)):await setDoc(doc(db,'verified',id),{by:me.id,date:Date.now()})}catch(x){toast('Só o admin com e-mail verificado pode ('+x.code+')')}}

const setSort=v=>{sortBy=v;renderGrid()},setSz=v=>{sizeF=v;renderGrid()},setGal=(id,i)=>{galIdx=i;openItem(id,true)},setQ=v=>{q=v;renderGrid()},setCity=v=>{cityF=v;renderGrid()},setCat=v=>{cat=v;render()},setSub=v=>{sub=v;render()};
Object.assign(window,{submitAuth,setAuth,logout,go,openItem,pickSize,closeModal,buy,setOrder,pickPhoto,publish,delListing,goGuest,goAuth,installApp,forgot,reportL,sendRep,adminDel,banUser,ignoreRep,startChat,openRoom,sendMsg,showTerms,pickAv,rateOrder,sendRev,setQ,setCity,setCat,setSub,setSort,setSz,setGal,rmPh,editL,saveProf,toggleVer});
</script>
